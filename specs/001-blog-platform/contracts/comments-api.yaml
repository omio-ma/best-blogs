openapi: 3.0.3
info:
  title: Comments API
  description: Public API for viewing and submitting comments on blog posts
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/comments
    description: Local development server

paths:
  /posts/{postId}/comments:
    get:
      summary: List comments for a blog post
      operationId: listComments
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Number of comments to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of comments to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  total:
                    type: integer
                    description: Total number of non-spam comments
                  hasMore:
                    type: boolean
                    description: Whether there are more comments to load
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      summary: Submit a new comment
      operationId: createComment
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Comment:
      type: object
      required:
        - id
        - postId
        - commenterName
        - content
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        commenterName:
          type: string
          minLength: 2
          maxLength: 50
        content:
          type: string
          minLength: 10
          maxLength: 1000
        createdAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      required:
        - commenterName
        - commenterEmail
        - content
      properties:
        commenterName:
          type: string
          minLength: 2
          maxLength: 50
          example: "John Doe"
        commenterEmail:
          type: string
          format: email
          maxLength: 255
          example: "john.doe@example.com"
        content:
          type: string
          minLength: 10
          maxLength: 1000
          example: "Great post! I really enjoyed reading this."

  responses:
    BadRequest:
      description: Bad request - validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Validation failed"
              details:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string

    NotFound:
      description: Blog post not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Blog post not found"

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Rate limit exceeded. Please wait before submitting another comment."
              retryAfter:
                type: integer
                description: Seconds until next submission allowed

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
